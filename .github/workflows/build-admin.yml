name: Build Admin Docker image
on:
  push:
    paths:
      - "admin/**"
    branches:
      - main
      - v2
jobs:
  build_and_upload:
    name: Build image and push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetches full history for better caching/context

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v7
        env:
          VITE_BACKEND_URL: ${{ vars.API_URL }}
        with:
          context: .
          file: admin/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-admin:latest
          cache-from: type=local,src=/tmp/.buildx-cache
      #
      # - name: Trigger deployment via webhook
      #   run: curl ${{ secrets.PROD_WEBHOOK }}
